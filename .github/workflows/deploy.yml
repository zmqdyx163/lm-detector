name: Deploy to Cloudflare Workers

# 三件事：
# 1. 先把 fork 和上游 Ikaleio/lm-detector 对齐（merge-upstream，服务端合并，不落盘 2GB 的 data/collections）
# 2. 按上游的完整流程构建（sync-data → typecheck → web → docs → proxy）
# 3. 用 wrangler 把 web/dist + /api/proxy 推到 Worker lm-fingerpoint-detector
on:
  push:
    branches: [main]
  schedule:
    # 每天 03:00 UTC = 北京时间 11:00，主动跟一次上游
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          res=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -d '{"branch":"main"}')
          body=$(printf '%s' "$res" | sed '$d')
          code=$(printf '%s' "$res" | tail -n1)
          echo "merge-upstream HTTP $code"
          printf '%s\n' "$body" | head -c 600
          echo
          # 409 = 上游和本地新增文件冲突，此时不阻断部署，用当前代码继续
          if [ "$code" != "200" ] && [ "$code" != "409" ]; then
            echo "::error::merge-upstream failed with $code"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          # data/collections 有 2GB / 一万多个文件，构建用不到，跳过
          sparse-checkout: |
            /*
            !/data/collections
          sparse-checkout-cone-mode: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare worker entry
        run: |
          mkdir -p .cf-worker
          mv web/dist/_worker.js .cf-worker/index.js
          ls -lh .cf-worker/index.js

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: bunx wrangler deploy -c wrangler.deploy.jsonc
